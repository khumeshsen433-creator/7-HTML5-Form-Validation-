<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Validated Registration Form</title></head>
<body>
<h1>Student Registration Form</h1>
<form>

    <label for="name">
        Name:
    </label>

    <input
        type="text"
        id="name"
        name="name"
        minlength="3"
        maxlength="30"
        pattern="[A-Za-z ]{3,30}"
        required>

    <br><br>

    <label for="email">
        Email:
    </label>

    <input
        type="email"
        id="email"
        name="email"
        required>

    <br><br>

    <label for="age">
        Age:
    </label>

    <input
        type="number"
        id="age"
        name="age"
        min="17"
        max="60"
        required>

    <br><br>

    <label for="phone">
        Mobile Number:
    </label>

    <input
        type="tel"
        id="phone"
        name="phone"
        pattern="[0-9]{10}"
        title="Enter a 10-digit mobile number"
        required>

    <br><br>

    <label for="password">
        Password:
    </label>

    <input
        type="password"
        id="password"
        name="password"
        minlength="6"
        maxlength="15"
        required>

    <br><br>

    <label for="course">
        Course:
    </label>

    <select
        id="course"
        name="course"
        required>

        <option value="">
            Select Course
        </option>

        <option value="BCA">
            BCA
        </option>

        <option value="BTech">
            B.Tech
        </option>

        <option value="MCA">
            MCA
        </option>

    </select>

    <br><br>

    <button type="submit">
        Register
    </button>
</form>
</body></html>
